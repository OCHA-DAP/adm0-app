[project]
name = "adm0-site"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "httpx2>=2.16.0",
    "portolan-cli>=0.9.0",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "topo-tools>=0.19.1",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
fix = true
extend-exclude = ["pipeline/fieldmaps_publish.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "INP001", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.uv]
override-dependencies = ["duckdb>=2.0.0"]
python-preference = "only-managed"
