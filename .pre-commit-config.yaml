repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-remote-path
        name: block the catalog's remote path
        language: system
        entry: >-
          bash -c 'r=$(sed -n "s/^PORTOLAN_REMOTE=[\"]*s3:\/\/\([^\"]*\)[\"]*$/\1/p" .env 2>/dev/null);
          r=${r%/}; [ -z "$r" ] || ! grep -lF "$r" "$@"' --
